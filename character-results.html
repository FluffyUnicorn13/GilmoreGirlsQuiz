<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scare=1.0">
    <title>Character Quiz Results</title>
    <link rel="stylesheet" href="styles.css?v=3">
</head>

<body class="results-page">

    <div class="results-background">
        <div class="results-container">
            <h1>Character Quiz Results</h1>

            <p id="character-score-text"></p>
            <button id="download-btn">Download Results</button>
            <button onclick="window.location.href= 'characters.html'">Restart Quiz</button>
            <button onclick="window.location.href= 'gilmore-select.html'">Choose Another Quiz</button>
        </div>
    </div>
<script>
    const score = localStorage.getItem("characterScore") || 0;

    document.getElementById("character-score-text").textContent =
    `You Correctly Named ${score} Characters!`;

    document.getElementById("download-btn").addEventListener("click", () =>{
        const scoreText = `Gilmore Girls Character Quiz Results You Correctly Named ${score} Characters!`;

        const blob = new Blob([scoreText], {type: "text/plain"})
        const url = URL.createdObjectURL(blob);
        
        const a = document.createElement("a");
        a.href = url;
        a.download = "GilmoreGirlsCharacterQuizResults.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        URL.revokeObjectURL(url);
    });

</script>
</body>
</html>
